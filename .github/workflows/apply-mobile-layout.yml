name: Apply mobile layout patch

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure mobile stylesheet is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="mobile.css?v=16">'
          if 'href="mobile.css' not in s:
              s = s.replace('<link rel="manifest" href="manifest.json">', '<link rel="manifest" href="manifest.json">\n' + link, 1)
          else:
              s = re.sub(r'<link[^>]+href=["\']mobile\.css[^>]*>', link, s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit mobile stylesheet link
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load mobile stylesheet directly'
          git push
