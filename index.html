<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f18">
<link rel="manifest" href="manifest.json">
<title>Russ's Pokémon League OS</title>
<style>
:root{--bg:#070a10;--p:#101a29;--p2:#172438;--ink:#dcecff;--muted:#8da2bd;--line:#4b6380;--cyan:#68d9ff;--green:#62e58a;--gold:#ffd65a;--red:#ff7070}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace}body{image-rendering:pixelated}
button,input,textarea,select{font:inherit}button{background:#18273c;color:var(--ink);border:2px outset #657f9e;padding:8px 11px;cursor:pointer}button:hover{background:#243957}button:active{border-style:inset}
input,textarea,select{width:100%;background:#080f19;color:#fff;border:2px inset #536a84;padding:9px}textarea{min-height:90px}
.app{padding:9px;min-height:100vh}.os{max-width:1500px;margin:auto;background:#0b111b;border:3px ridge #7289a5;box-shadow:8px 8px 0 #000}
.titlebar{height:42px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#273b59,#101b2b);border-bottom:2px solid #536984}.title{font-weight:bold}.clock{font-size:12px;color:#9fb4cc}
.toolbar{display:flex;gap:5px;padding:6px;background:#0d1622;border-bottom:2px solid var(--line);overflow:auto}.nav{white-space:nowrap;font-size:11px}.nav.active{background:#31587f;color:#fff}
.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 70px)}aside{padding:8px;border-right:2px solid var(--line);background:#0a121d}.sidehead{color:var(--gold);font-weight:bold;padding:7px;border-bottom:1px dotted #53657d}.side{display:block;width:100%;text-align:left;margin:4px 0}.side.active{background:#294b70}
main{padding:12px}.grid{display:grid;gap:11px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:linear-gradient(#172337,#0e1725);border:3px ridge #526b89;padding:11px;box-shadow:4px 4px 0 #02050a}.panel h2{margin:0 0 10px}.heading{font-size:20px;color:var(--gold);font-weight:bold}.small{font-size:11px;color:var(--muted)}.label{font-size:10px;color:#91a8c4;text-transform:uppercase}.kpi{font-size:25px;font-weight:bold;color:#fff}.card{background:#09111c;border:2px solid #405774;padding:8px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.bar{height:13px;background:#050a10;border:2px inset #50637a;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#429cff,#73e4ff)}.bar.gold i{background:linear-gradient(90deg,#d3a622,#ffe676)}.bar.green i{background:linear-gradient(90deg,#35b765,#7af29a)}
.pokes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.poke{background:#0a121e;border:3px ridge #536b88;padding:7px}.poke img{display:block;width:92px;height:92px;object-fit:contain;margin:auto;filter:drop-shadow(2px 2px 0 #000)}.lv{color:var(--gold)}.pill{display:inline-block;padding:2px 5px;border:1px solid #506781;background:#142136;font-size:10px;margin:2px}
.trainer{width:100%;max-height:360px;object-fit:contain;background:#05080d;border:2px inset #43566e}.list{display:grid;gap:7px;max-height:500px;overflow:auto}.item{background:#0a121d;border:2px solid #3d5572;padding:8px}
.objective{display:grid;grid-template-columns:27px 1fr auto;gap:9px;align-items:start;padding:10px 0;border-bottom:1px dotted #4a5e76}.objective input{width:20px;height:20px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:54px;padding:4px;font-size:10px}.day.done{background:#19452d;border-color:#55bd7b}.day.today{outline:2px solid var(--gold)}
.coat{min-height:340px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1c2d47,#080e17 70%);position:relative}.shield{width:260px;height:285px;background:linear-gradient(135deg,#2a4c70,#0b1828);border:6px ridge #a7bed5;clip-path:polygon(8% 0,92% 0,100% 12%,92% 76%,50% 100%,8% 76%,0 12%);position:relative}.shield:after{content:"R";position:absolute;inset:58px 0 0;text-align:center;font-size:100px;font-weight:bold;color:#91b7dc44}.badgegrid{position:absolute;width:235px;top:55px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.badgegrid img,.badge-fallback{width:48px;height:48px;object-fit:contain;margin:auto}.badge-fallback{border:3px ridge #d7e6f7;clip-path:polygon(50% 0,90% 20%,100% 65%,70% 100%,30% 100%,0 65%,10% 20%);background:radial-gradient(circle,#fff,#5fa7d9 45%,#203a58)}
.friendgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.friend{display:grid;grid-template-columns:90px 1fr;gap:9px}.friend img{width:90px;height:110px;object-fit:contain;background:#05080d;border:2px inset #4b6078}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111d2d;border:4px ridge #7891af;box-shadow:9px 9px #000;padding:14px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.full{grid-column:1/-1}
.status{padding:7px 10px;border-top:2px solid var(--line);background:#0c1420;font-size:11px;color:#a7bbd1}.success{color:var(--green)}.error{color:var(--red)}.warn{color:var(--gold)}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:2px solid var(--line)}.g2,.g3{grid-template-columns:1fr}.pokes{grid-template-columns:repeat(2,1fr)}.friendgrid{grid-template-columns:1fr}}
@media(max-width:520px){main{padding:7px}.pokes{grid-template-columns:1fr 1fr}.poke img{width:72px;height:72px}.form{grid-template-columns:1fr}.month .day{min-height:42px;font-size:9px}}
</style>
</head>
<body>
<div class="app"><div class="os">
<div class="titlebar"><div class="title">▣ RUSS'S POKÉMON LEAGUE OS // 90s EDITION</div><div class="clock" id="clock"></div></div>
<div class="toolbar" id="topnav"></div>
<div class="layout"><aside><div class="sidehead">LEAGUE MENU</div><div id="sidenav"></div><div class="panel" style="margin-top:9px"><div class="label">LEAGUE LEVEL</div><div class="kpi" id="sideLevel">1</div><div class="bar gold"><i id="sideBar"></i></div><div class="small" id="sideXp">0 / 100 XP</div></div></aside>
<main id="view"></main></div><div class="status" id="status">READY // LOCAL SAVE ACTIVE</div>
</div></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const VERSION="6.0", SAVE_KEY="russ_league_v6", SYNC_KEY="russ_league_sync_v6";
const API="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/";
const BADGES=[
{id:"mind",name:"Mind Badge",desc:"Study, research, learning and intellectual work."},
{id:"body",name:"Body Badge",desc:"Training, movement, physical development and recovery."},
{id:"craft",name:"Craft Badge",desc:"Creative work, projects, writing and making."},
{id:"social",name:"Social Badge",desc:"Communication, confidence and relationships."},
{id:"career",name:"Career Badge",desc:"Professional development and useful skills."},
{id:"order",name:"Order Badge",desc:"Consistency, planning and finishing what you start."},
{id:"explore",name:"Explorer Badge",desc:"Curiosity, reading, discovery and new experiences."},
{id:"resilience",name:"Resilience Badge",desc:"Hard tasks, setbacks and returning stronger."}];
const RUSS=[
{id:"gible",base:"Gible",forms:["Gible","Gabite","Garchomp"],levels:[10,20],badge:"mind"},
{id:"eevee-umbreon",base:"Eevee",forms:["Eevee","Umbreon"],levels:[20],badge:"order"},
{id:"riolu",base:"Riolu",forms:["Riolu","Lucario"],levels:[20],badge:"body"},
{id:"mew",base:"Mew",forms:["Mew"],levels:[],badge:"explore"},
{id:"snivy",base:"Snivy",forms:["Snivy","Servine","Serperior"],levels:[10,20],badge:"craft"},
{id:"froakie",base:"Froakie",forms:["Froakie","Frogadier","Ash-Greninja"],levels:[10,20],badge:"social"}];
const DJ=[
["Pikachu",["Pikachu","Raichu"],[20]],["Charmander",["Charmander","Charmeleon","Charizard","Mega Charizard X"],[10,20,30]],
["Ditto",["Ditto"],[]],["Abra",["Abra","Kadabra","Alakazam"],[10,20]],["Lapras",["Lapras"],[]],["Eevee",["Eevee","Vaporeon"],[20]]];
const REWARDS=[
{id:"save",name:"SAVE POINT",cost:50,desc:"A ceremonial League save stamp."},
{id:"title",name:"CHALLENGER TITLE",cost:150,desc:"Unlocks the Challenger title on your profile."},
{id:"case",name:"DELUXE BADGE CASE",cost:300,desc:"Unlocks the deluxe badge-case display."},
{id:"candy",name:"RARE CANDY",cost:500,desc:"Adds one Rare Candy to inventory. Each candy gives 100 Pokémon XP."},
{id:"master",name:"MASTER KEY",cost:1000,desc:"Marks one personal milestone as a League achievement."}];
const FRIEND_POOL=["Umbreon","Lucario","Garchomp","Zoroark","Weavile","Hydreigon","Kingambit","Gardevoir","Gallade","Greninja","Metagross","Dragonite","Tyranitar","Absol","Sylveon","Arcanine","Milotic"];
function fresh(){
 const pokemon={};RUSS.forEach(p=>pokemon[p.id]={xp:0,level:1});
 return {version:VERSION,name:"Russ",updatedAt:Date.now(),leagueXP:0,coins:0,badges:Object.fromEntries(BADGES.map(b=>[b.id,{xp:0,level:1}])),pokemon,
 objectives:[],journal:[],monthly:{},inventory:[{id:"potion",name:"Potion",qty:3,desc:"A symbolic motivation restore."},{id:"pokeball",name:"Poké Ball",qty:5,desc:"A reminder that objectives are catchable."},{id:"rare-candy",name:"Rare Candy",qty:0,desc:"Grants 100 Pokémon XP."}],
 rewards:[],friends:[],rival:{stats:Object.fromEntries(BADGES.map(b=>[b.id,1]))},settings:{autoSync:true}};
}
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(SAVE_KEY))}}catch(e){return fresh()}}
let S=load(), C=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{url:"",key:"",id:"russ"}}catch(e){return {url:"",key:"",id:"russ"}}})();
let page="dashboard", client=null, pushTimer=null;
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function level(xp){return Math.max(1,Math.min(50,1+Math.floor(xp/100)))} function form(def,l){let i=0;def.levels.forEach(n=>{if(l>=n)i++});return def.forms[Math.min(i,def.forms.length-1)]}
function pokeId(name){const m={Gible:443,Gabite:444,Garchomp:445,Eevee:133,Umbreon:197,Riolu:447,Lucario:448,Mew:151,Snivy:495,Servine:496,Serperior:497,Froakie:656,Frogadier:657,Greninja:658,Pikachu:25,Raichu:26,Charmander:4,Charmeleon:5,Charizard:6,Ditto:132,Abra:63,Kadabra:64,Alakazam:65,Lapras:131,Vaporeon:134};return m[name]||null}
function img(name){let id=pokeId(name);return id?API+id+".png":`https://img.pokemondb.net/sprites/home/normal/${name.toLowerCase().replaceAll(" ","-")}.png`}
function save(){S.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S));schedulePush();renderSide()}
function msg(t,cl=""){ $("status").innerHTML=cl?`<span class="${cl}">${esc(t)}</span>`:esc(t)}
function schedulePush(){if(!S.settings.autoSync||!C.url||!C.key||!C.id)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>push(true),1800)}
function addJournal(title,text){S.journal.unshift({id:crypto.randomUUID(),date:Date.now(),title,text})}
function award(xp,badges,ids){
 S.leagueXP+=xp;S.coins+=Math.max(1,Math.floor(xp/5));
 ids.forEach(id=>{if(S.pokemon[id]){S.pokemon[id].xp+=xp;S.pokemon[id].level=level(S.pokemon[id].xp)}});
 badges.forEach(id=>{if(S.badges[id]){S.badges[id].xp+=Math.round(xp*.65);S.badges[id].level=level(S.badges[id].xp);S.rival.stats[id]=Math.max(1,S.rival.stats[id]+Math.max(1,Math.floor(xp/35))+(Math.random()<.35?1:Math.random()<.18?-1:0))}});
 save()
}
function nav(){const items=[["dashboard","HOME"],["trainer","TRAINER"],["pokemon","POKÉMON"],["objectives","QUESTS"],["monthly","MONTHLY"],["badges","BADGES"],["rival","RIVAL: DJ"],["friends","FRIENDS"],["journal","JOURNAL"],["inventory","INVENTORY"],["rewards","REWARDS"],["sync","SYNC"]];$("topnav").innerHTML=items.map(x=>`<button class="nav ${page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("sidenav").innerHTML=items.map(x=>`<button class="side ${page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function renderSide(){let l=level(S.leagueXP);$("sideLevel").textContent=l;$("sideBar").style.width=(S.leagueXP%100)+"%";$("sideXp").textContent=(S.leagueXP%100)+" / 100 XP"}
function go(p){page=p;render()}
function render(){nav();renderSide();({dashboard,trainer,pokemon,objectives,monthly,badges,rival,friends,journal,inventory,rewards,sync}[page]||dashboard)()}
function coat(){return `<div class="coat"><div class="shield"></div><div class="badgegrid">${BADGES.map((b,i)=>`<img src="assets/badge-${i+1}.svg" alt="${esc(b.name)}" onerror="this.outerHTML='<div class=badge-fallback></div>'">`).join("")}</div></div>`}
function pcard(d){let p=S.pokemon[d.id],f=form(d,p.level),next=d.levels.find(n=>p.level<n);return `<div class="poke"><img src="${img(f)}" alt="${esc(f)}"><div class="row between"><b>${esc(f)}</b><span class="lv">Lv.${p.level}</span></div><div class="bar"><i style="width:${p.xp%100}%"></i></div><div class="small">${p.xp%100}/100 XP · ${BADGES.find(b=>b.id===d.badge).name}</div><div class="small ${next?"":"success"}">${next?"Next evolution: Lv."+next:"FINAL FORM"}</div></div>`}
function dashboard(){$("view").innerHTML=`<div class="grid g2"><section class="panel"><div class="heading">LEAGUE STATUS</div><div class="grid g3" style="margin-top:10px"><div class="card"><div class="label">LEVEL</div><div class="kpi">${level(S.leagueXP)}</div></div><div class="card"><div class="label">CREDITS</div><div class="kpi">${S.coins}</div></div><div class="card"><div class="label">QUESTS</div><div class="kpi">${S.objectives.filter(x=>x.done).length}/${S.objectives.length}</div></div></div></section><section class="panel"><div class="heading">QUEST BOARD</div>${S.objectives.filter(x=>!x.done).slice(0,4).map(o=>`<div class="item"><b>${esc(o.title)}</b><div class="small">${esc(o.desc)}</div><span class="pill">+${o.xp} XP</span></div>`).join("")||`<div class="item">No active objectives.</div>`}</section></div><section class="panel" style="margin-top:11px"><div class="row between"><div class="heading">PARTY // CURRENT FORMS</div><span class="small">Every Pokémon levels independently.</span></div><div class="pokes" style="margin-top:9px">${RUSS.map(pcard).join("")}</div></section><div class="grid g2" style="margin-top:11px"><section class="panel"><div class="heading">COAT OF ARMS</div>${coat()}</section><section class="panel"><div class="heading">RIVAL SIGNAL</div><div class="friend"><img src="assets/dj-trainer.png" onerror="this.src='assets/dj-trainer.svg'"><div><h2>DJ</h2><div class="label">RIVAL LEVEL</div><div class="kpi">${Math.round(Object.values(S.rival.stats).reduce((a,b)=>a+b,0)/8)}</div><p class="small">His stats rise with yours, but variance means he can pull ahead or fall behind.</p><button onclick="go('rival')">VIEW RIVAL</button></div></div></section></div>`}
function trainer(){$("view").innerHTML=`<div class="grid g2"><section class="panel"><div class="heading">TRAINER CARD</div><img class="trainer" src="assets/russ-trainer.png" onerror="this.src='assets/russ-trainer.svg'"><div class="grid g2" style="margin-top:9px"><div class="card"><div class="label">NAME</div><b>RUSS</b></div><div class="card"><div class="label">REGION</div><b>SINNOH</b></div><div class="card"><div class="label">LEAGUE LEVEL</div><b>${level(S.leagueXP)}</b></div><div class="card"><div class="label">CREDITS</div><b>${S.coins}</b></div></div></section><section class="panel"><div class="heading">STATISTICS</div>${BADGES.map(b=>{let x=S.badges[b.id];return `<div class="card" style="margin:7px 0"><div class="row between"><b>${b.name}</b><span>Lv.${x.level}</span></div><div class="bar"><i style="width:${x.xp%100}%"></i></div><div class="small">${x.xp%100}/100 XP</div></div>`}).join("")}</section></div>`}
function pokemon(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">POKÉMON DATABASE</div><div class="small">Evolution is tied to individual Pokémon XP.</div></div></div><div class="pokes" style="margin-top:9px">${RUSS.map(pcard).join("")}</div></section>`}
function objectives(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">QUEST BOARD</div><div class="small">Objectives can feed multiple badges and multiple Pokémon at once.</div></div><button onclick="objectiveForm()">+ NEW OBJECTIVE</button></div><div class="list" style="margin-top:9px">${S.objectives.map(o=>`<div class="objective"><input type="checkbox" ${o.done?"checked disabled":""} onchange="complete('${o.id}')"><div><b>${esc(o.title)}</b><div class="small">${esc(o.desc)}</div>${o.badges.map(id=>`<span class="pill">${BADGES.find(b=>b.id===id).name}</span>`).join("")}${o.ids.map(id=>`<span class="pill">${RUSS.find(p=>p.id===id).base}</span>`).join("")}</div><button onclick="objectiveForm('${o.id}')">EDIT</button></div>`).join("")||`<div class="item">QUEST BOARD EMPTY.</div>`}</div></section>`}
function objectiveForm(id){let o=id?S.objectives.find(x=>x.id===id):{id:crypto.randomUUID(),title:"",desc:"",xp:25,badges:["order"],ids:["gible"],done:false};$("modalbox").innerHTML=`<h2>${id?"EDIT":"NEW"} OBJECTIVE</h2><div class="form"><div class="full"><label>Title</label><input id="ot" value="${esc(o.title)}"></div><div class="full"><label>Description</label><textarea id="od">${esc(o.desc)}</textarea></div><div><label>Pokémon XP</label><input id="ox" type="number" min="1" value="${o.xp}"></div><div><label>Bonus Credits</label><input id="oc" type="number" min="0" value="${o.coins||0}"></div><div class="full"><b>Badges</b><div class="grid g2">${BADGES.map(b=>`<label class="card"><input class="bc" type="checkbox" value="${b.id}" ${o.badges.includes(b.id)?"checked":""}> ${b.name}</label>`).join("")}</div></div><div class="full"><b>Pokémon</b><div class="grid g2">${RUSS.map(p=>`<label class="card"><input class="pc" type="checkbox" value="${p.id}" ${o.ids.includes(p.id)?"checked":""}> ${p.base} → ${p.forms.at(-1)}</label>`).join("")}</div></div></div><div class="row" style="margin-top:10px"><button onclick="saveObjective('${o.id}')">SAVE</button><button onclick="closeModal()">CANCEL</button></div>`;$("modal").classList.add("open")}
function saveObjective(id){let title=$("ot").value.trim();if(!title)return alert("Give the objective a title.");let x={id,title,desc:$("od").value.trim(),xp:+$("ox").value||25,coins:+$("oc").value||0,badges:[...document.querySelectorAll(".bc:checked")].map(x=>x.value),ids:[...document.querySelectorAll(".pc:checked")].map(x=>x.value),done:false};let i=S.objectives.findIndex(o=>o.id===id);if(i>=0){x.done=S.objectives[i].done;S.objectives[i]=x}else S.objectives.push(x);closeModal();save();render()}
function complete(id){let o=S.objectives.find(x=>x.id===id);if(!o||o.done)return;o.done=true;award(o.xp,o.badges,o.ids);S.coins+=o.coins||0;addJournal("OBJECTIVE COMPLETE",`${o.title}\n${o.desc}\nReward: ${o.xp} XP + ${o.coins||0} bonus credits.`);save();render()}
function monthly(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),count=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),key=`${y}-${String(m+1).padStart(2,"0")}`,done=Object.keys(S.monthly).filter(k=>k.startsWith(key)&&S.monthly[k]).length,cells="";for(let i=0;i<first;i++)cells+="<div></div>";for(let n=1;n<=count;n++){let k=`${key}-${String(n).padStart(2,"0")}`,today=n===d.getDate();cells+=`<button class="day ${S.monthly[k]?"done":""} ${today?"today":""}" onclick="day('${k}')"><b>${n}</b><br>${S.monthly[k]?"✓":"□"}</button>`}$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">MONTHLY TRACKER // ${d.toLocaleString(undefined,{month:"long",year:"numeric"}).toUpperCase()}</div><div class="small">One checkbox per day. Each check-in gives 10 League XP and 2 credits.</div></div><div class="kpi">${done}/${count}</div></div><div class="month" style="margin-top:10px">${["SUN","MON","TUE","WED","THU","FRI","SAT"].map(x=>`<div class="small" style="text-align:center">${x}</div>`).join("")}${cells}</div></section>`}
function day(k){if(S.monthly[k])return;S.monthly[k]=true;S.leagueXP+=10;S.coins+=2;addJournal("MONTHLY CHECK-IN",`Completed ${k}.`);save();render()}
function badges(){$("view").innerHTML=`<div class="grid g2"><section class="panel"><div class="heading">BADGE CASE</div>${BADGES.map((b,i)=>{let x=S.badges[b.id];return `<div class="card" style="margin:7px 0"><div class="row"><img src="assets/badge-${i+1}.svg" style="width:48px;height:48px;object-fit:contain" onerror="this.outerHTML='<div class=badge-fallback></div>'"><div style="flex:1"><div class="row between"><b>${b.name}</b><span>Lv.${x.level}</span></div><div class="small">${b.desc}</div><div class="bar"><i style="width:${x.xp%100}%"></i></div></div></div></div>`}).join("")}</section><section class="panel"><div class="heading">LEAGUE EMBLEM</div>${coat()}<div class="item">Eight distinct disciplines combine into one League emblem. No single stat is the “main” stat.</div></section></div>`}
function rival(){$("view").innerHTML=`<div class="grid g2"><section class="panel"><div class="heading">RIVAL PROFILE // DJ</div><img class="trainer" src="assets/dj-trainer.png" onerror="this.src='assets/dj-trainer.svg'"><p>DJ is permanent and non-editable. His stats grow whenever yours grow, with controlled random variation so the rivalry stays alive.</p></section><section class="panel"><div class="heading">DJ STAT BOARD</div>${BADGES.map(b=>`<div class="card" style="margin:7px 0"><div class="row between"><b>${b.name}</b><span>Lv.${S.rival.stats[b.id]}</span></div><div class="bar"><i style="width:${S.rival.stats[b.id]%100}%"></i></div></div>`).join("")}<h3>DJ'S TEAM</h3><div class="pokes">${DJ.map(x=>`<div class="poke"><img src="${img(x[1].at(-1))}"><b>${esc(x[1].at(-1))}</b><div class="small">Final form</div></div>`).join("")}</div></section></div>`}
function friends(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">FRIEND REGISTER</div><div class="small">Add a friend, give three traits, and the game generates a six-Pokémon final-form team.</div></div><button onclick="friendForm()">+ ADD FRIEND</button></div><div class="friendgrid" style="margin-top:10px">${S.friends.map(f=>`<div class="card friend"><img src="${esc(f.sprite||"assets/russ-trainer.png")}" onerror="this.src='assets/russ-trainer.png'"><div><h2>${esc(f.name)}</h2><div class="small">${f.traits.map(esc).join(" · ")}</div><div class="small">Journey Lv.${f.level}</div><div>${f.team.map(esc).map(x=>`<span class="pill">${x}</span>`).join("")}</div></div></div>`).join("")||`<div class="item">No friends registered yet.</div>`}</div></section>`}
function teamFor(words){let w=words.join(" ").toLowerCase(),map={dark:["Umbreon","Zoroark","Weavile","Hydreigon","Kingambit","Absol"],smart:["Alakazam","Metagross","Gardevoir"],strong:["Garchomp","Tyranitar","Dragonite","Lucario"],creative:["Mew","Gardevoir","Zoroark","Sylveon"],calm:["Lapras","Milotic","Vaporeon","Umbreon"],chaotic:["Ditto","Zoroark","Greninja"],social:["Sylveon","Lucario","Gardevoir","Dragonite"],fast:["Weavile","Greninja","Lucario","Zoroark"],fun:["Ditto","Greninja","Gengar"]},out=[];Object.entries(map).forEach(([k,a])=>{if(w.includes(k))a.forEach(x=>out.push(x))});FRIEND_POOL.forEach(x=>out.push(x));return [...new Set(out)].slice(0,6)}
function friendForm(){$("modalbox").innerHTML=`<h2>NEW FRIEND TRAINER</h2><div class="form"><div class="full"><label>Name</label><input id="fn"></div><div><label>Word 1</label><input id="fw1"></div><div><label>Word 2</label><input id="fw2"></div><div class="full"><label>Word 3</label><input id="fw3"></div><div class="full"><label>Optional sprite path</label><input id="fs" placeholder="assets/my-friend.png"></div></div><div class="row" style="margin-top:10px"><button onclick="saveFriend()">GENERATE TEAM</button><button onclick="closeModal()">CANCEL</button></div>`;$("modal").classList.add("open")}
function saveFriend(){let name=$("fn").value.trim(),traits=[$("fw1").value.trim(),$("fw2").value.trim(),$("fw3").value.trim()];if(!name||traits.some(x=>!x))return alert("Enter a name and exactly three words.");S.friends.push({id:crypto.randomUUID(),name,traits,level:1,xp:0,team:teamFor(traits),sprite:$("fs").value.trim()||"assets/russ-trainer.png"});addJournal("NEW FRIEND TRAINER",`${name} joined the League. Traits: ${traits.join(", ")}.`);save();closeModal();render()}
function journal(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">JOURNAL LOG</div><div class="small">Permanent record of milestones and events.</div></div><button onclick="journalForm()">+ NEW ENTRY</button></div><div class="list" style="margin-top:10px">${S.journal.map(j=>`<div class="item"><div class="row between"><b>${esc(j.title)}</b><span class="small">${new Date(j.date).toLocaleString()}</span></div><div style="white-space:pre-wrap;margin-top:6px">${esc(j.text)}</div></div>`).join("")||`<div class="item">JOURNAL EMPTY.</div>`}</div></section>`}
function journalForm(){$("modalbox").innerHTML=`<h2>JOURNAL ENTRY</h2><label>Title</label><input id="jt"><label>Entry</label><textarea id="jx"></textarea><div class="row" style="margin-top:10px"><button onclick="saveJournal()">ADD ENTRY</button><button onclick="closeModal()">CANCEL</button></div>`;$("modal").classList.add("open")}
function saveJournal(){let t=$("jt").value.trim(),x=$("jx").value.trim();if(!t||!x)return;addJournal(t,x);save();closeModal();render()}
function inventory(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">INVENTORY</div><div class="small">Persistent items earned and redeemed in the League.</div></div><button onclick="itemForm()">+ ADD ITEM</button></div><div class="list" style="margin-top:10px">${S.inventory.map(i=>`<div class="item"><div class="row between"><b>${esc(i.name)}</b><span class="pill">×${i.qty}</span></div><div class="small">${esc(i.desc)}</div><div style="margin-top:6px"><button onclick="changeItem('${i.id}',1)">+1</button><button onclick="changeItem('${i.id}',-1)">-1</button>${i.id==="rare-candy"?`<button onclick="rareCandy()">USE</button>`:""}</div></div>`).join("")}</div></section>`}
function changeItem(id,n){let i=S.inventory.find(x=>x.id===id);if(i){i.qty=Math.max(0,i.qty+n);save();render()}}
function rareCandy(){let i=S.inventory.find(x=>x.id==="rare-candy");if(!i||i.qty<1)return;let opts=RUSS.map(p=>`<option value="${p.id}">${p.base}</option>`).join("");$("modalbox").innerHTML=`<h2>RARE CANDY</h2><select id="rc">${opts}</select><div class="row" style="margin-top:10px"><button onclick="useCandy()">USE RARE CANDY</button><button onclick="closeModal()">CANCEL</button></div>`;$("modal").classList.add("open")}
function useCandy(){let i=S.inventory.find(x=>x.id==="rare-candy"),id=$("rc").value;if(!i||i.qty<1)return;i.qty--;S.pokemon[id].xp+=100;S.pokemon[id].level=level(S.pokemon[id].xp);addJournal("RARE CANDY USED",`${RUSS.find(p=>p.id===id).base} received 100 XP.`);save();closeModal();render()}
function itemForm(){$("modalbox").innerHTML=`<h2>ADD ITEM</h2><label>Name</label><input id="in"><label>Quantity</label><input id="iq" type="number" value="1"><label>Description</label><textarea id="id"></textarea><div class="row" style="margin-top:10px"><button onclick="saveItem()">ADD</button><button onclick="closeModal()">CANCEL</button></div>`;$("modal").classList.add("open")}
function saveItem(){let n=$("in").value.trim();if(!n)return;S.inventory.push({id:crypto.randomUUID(),name:n,qty:+$("iq").value||1,desc:$("id").value.trim()});save();closeModal();render()}
function rewards(){$("view").innerHTML=`<section class="panel"><div class="row between"><div><div class="heading">REWARD SHOP</div><div class="small">Spend League Credits earned from objectives and monthly check-ins.</div></div><div class="kpi">${S.coins}¢</div></div><div class="grid g2" style="margin-top:10px">${REWARDS.map(r=>{let got=S.rewards.includes(r.id);return `<div class="card"><div class="row between"><b>${r.name}</b><span class="pill">${r.cost}¢</span></div><p class="small">${r.desc}</p><button ${got||S.coins<r.cost?"disabled":""} onclick="buy('${r.id}')">${got?"CLAIMED":S.coins<r.cost?"LOCKED":"REDEEM"}</button></div>`}).join("")}</div></section>`}
function buy(id){let r=REWARDS.find(x=>x.id===id);if(!r||S.rewards.includes(id)||S.coins<r.cost)return;S.coins-=r.cost;S.rewards.push(id);if(id==="candy")S.inventory.find(x=>x.id==="rare-candy").qty++;addJournal("REWARD REDEEMED",`${r.name} redeemed for ${r.cost} credits.`);save();render()}
function sync(){$("view").innerHTML=`<section class="panel"><div class="heading">CROSS-DEVICE SYNC</div><p class="small">Use the same Supabase project, publishable key and Trainer ID on PC and phone. Push sends this device to the cloud. Pull replaces this device with the cloud save. Auto Sync pushes changes after edits and checks for newer cloud data every 30 seconds.</p><div class="form"><div class="full"><label>Supabase Project URL</label><input id="su" value="${esc(C.url)}" placeholder="https://YOURPROJECT.supabase.co"></div><div class="full"><label>Supabase publishable / anon key</label><input id="sk" value="${esc(C.key)}" placeholder="sb_publishable_..."></div><div><label>Trainer ID</label><input id="sid" value="${esc(C.id||"russ")}"></div><div class="card"><label>Auto Sync</label><br><input id="auto" type="checkbox" ${S.settings.autoSync?"checked":""}> Push changes automatically</div></div><div class="row wrap" style="margin-top:10px"><button onclick="saveConn()">SAVE CONNECTION</button><button onclick="test()">TEST</button><button onclick="push(false)">PUSH LOCAL SAVE</button><button onclick="pull()">PULL CLOUD SAVE</button></div><div class="item" style="margin-top:10px">Supabase table required: <b>trainer_saves</b> with <b>id</b>, <b>data</b>, <b>updated_at</b>.</div></section>`}
function init(){if(window.supabase&&C.url&&C.key){try{client=window.supabase.createClient(C.url,C.key)}catch(e){client=null}}}
function saveConn(){C={url:$("su").value.trim().replace(/\/$/,""),key:$("sk").value.trim(),id:$("sid").value.trim()||"russ"};S.settings.autoSync=$("auto").checked;localStorage.setItem(SYNC_KEY,JSON.stringify(C));save();init();msg("SYNC CONNECTION SAVED","success")}
async function test(){init();if(!client)return msg("SYNC ERROR // CHECK URL AND PUBLISHABLE KEY","error");try{let {error}=await client.from("trainer_saves").select("id").eq("id",C.id).limit(1);if(error)throw error;msg("CLOUD CONNECTION OK","success")}catch(e){msg("SYNC ERROR // "+e.message,"error")}}
async function push(silent){init();if(!client){if(!silent)msg("SYNC ERROR // CONFIGURE SUPABASE","error");return}try{let payload=JSON.parse(JSON.stringify(S));let {error}=await client.from("trainer_saves").upsert({id:C.id,data:payload,updated_at:new Date(payload.updatedAt).toISOString()},{onConflict:"id"});if(error)throw error;msg("CLOUD SAVED // "+new Date().toLocaleTimeString(),"success")}catch(e){if(!silent)msg("PUSH FAILED // "+e.message,"error")}}
async function pull(){init();if(!client)return msg("SYNC ERROR // CONFIGURE SUPABASE","error");try{let {data,error}=await client.from("trainer_saves").select("data,updated_at").eq("id",C.id).maybeSingle();if(error)throw error;if(!data)return msg("NO CLOUD SAVE FOUND // PUSH FROM YOUR MAIN DEVICE","warn");S={...fresh(),...data.data};localStorage.setItem(SAVE_KEY,JSON.stringify(S));msg("CLOUD PULLED // LOCAL SAVE UPDATED","success");render()}catch(e){msg("PULL FAILED // "+e.message,"error")}}
async function poll(){if(!S.settings.autoSync||!client)return;try{let {data}=await client.from("trainer_saves").select("data,updated_at").eq("id",C.id).maybeSingle();if(data&&new Date(data.updated_at).getTime()>S.updatedAt+1500){S={...fresh(),...data.data};localStorage.setItem(SAVE_KEY,JSON.stringify(S));msg("AUTO SYNC // NEWER CLOUD SAVE PULLED","success");render()}}catch(e){}}
function closeModal(){$("modal").classList.remove("open")}
window.go=go;window.objectiveForm=objectiveForm;window.saveObjective=saveObjective;window.complete=complete;window.day=day;window.friendForm=friendForm;window.saveFriend=saveFriend;window.journalForm=journalForm;window.saveJournal=saveJournal;window.itemForm=itemForm;window.saveItem=saveItem;window.changeItem=changeItem;window.rareCandy=rareCandy;window.useCandy=useCandy;window.buy=buy;window.saveConn=saveConn;window.test=test;window.push=push;window.pull=pull;window.closeModal=closeModal;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString(),1000);init();setInterval(poll,30000);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();
</script>
</body>
</html>
