name: Apply mobile redesign

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-layout.yml'
      - '.github/mobile-redesign-trigger'
      - 'mobile.css'
      - 'sw.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dedicated phone stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="mobile.css">'
          if link not in s:
              s=s.replace('</head>',link+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Load dedicated phone-first mobile layout'
          git push
